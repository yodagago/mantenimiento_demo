<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mantenimiento CV · Demo</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#173448;background:#f1f5f8}*{box-sizing:border-box}body{margin:0}header{background:#123c50;color:white;padding:20px}header div,main{max-width:1050px;margin:auto}h1{margin:0;font-size:24px}main{padding:18px 14px 60px}.banner{padding:13px;border-radius:10px;background:#fff0ca;margin-bottom:15px;border:1px solid #eed48b}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{border:0;background:#087587;color:white;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#e0ecf0;color:#194154}.card{background:white;border:1px solid #d6e3e9;border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.number{font-size:30px;font-weight:750}.muted{color:#5b7280}.hidden{display:none}input,textarea,select{display:block;width:100%;font:inherit;padding:11px;margin:6px 0 13px;border:1px solid #bacbd2;border-radius:8px}label{font-weight:650}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px;margin:0}.tag{background:#e4eef2;padding:4px 9px;border-radius:20px;font-size:12px}.ok{color:#187146}.error{color:#a33435}.entry{border-bottom:1px solid #e6edef;padding:11px 0}video{width:100%;max-width:480px;border-radius:10px;background:#111}small{color:#5b7280}@media(max-width:650px){.grid{grid-template-columns:1fr}header h1{font-size:21px}}
</style></head><body><header><div><h1>Mantenimiento CV</h1><div>Demostración general · Órdenes preventivas</div></div></header><main>
<div class="banner"><strong>Modo demostración:</strong> todos los datos son ficticios. Los cambios se guardan únicamente en este navegador; no se envían a Google Sheets.</div>
<nav><button data-tab="dashboard">Dashboard</button><button data-tab="ordenes" class="alt">Órdenes / QR</button><button data-tab="historial" class="alt">Historial</button></nav>
<section id="dashboard"><div class="grid"><div class="card"><div class="muted">Órdenes</div><div class="number" id="total"></div></div><div class="card"><div class="muted">Pendientes</div><div class="number" id="pendientes"></div></div><div class="card"><div class="muted">Cerradas</div><div class="number" id="cerradas"></div></div></div><div class="card"><h2>Resumen de estados</h2><div id="resumen"></div><p><button class="alt" id="reiniciar">Restablecer demostración</button></p></div></section>
<section id="ordenes" class="hidden"><div class="card"><h2>Buscar orden</h2><div class="row"><input id="buscar" placeholder="OTT, equipo o actividad" aria-label="Buscar orden"><button id="buscarBtn">Buscar</button><button id="qrBtn" class="alt">Escanear QR</button></div><p id="scanMsg" class="muted"></p><div id="scanner" class="hidden"><video id="video" autoplay muted playsinline></video><button id="detener" class="alt">Detener cámara</button></div><div id="lista"></div></div><div id="detalle" class="card hidden"></div></section>
<section id="historial" class="hidden"><div class="card"><h2>Historial de actividad</h2><div id="eventos"></div></div></section>
</main><script src="./demo.js"></script></body></html>
